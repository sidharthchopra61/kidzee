<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KIDZEE Jammu | Admin Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 36px 36px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #E2E8F0;
            position: relative;
        }

        /* Top-Left Red Back Button */
        .btn-back-red {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #DC2626;
            background: #FEE2E2;
            border: 1px solid #FECACA;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        .btn-back-red:hover {
            background: #DC2626;
            color: #FFFFFF;
            border-color: #DC2626;
        }

        h2 { font-family: 'Outfit', sans-serif; color: #0066B3; margin: 0 0 6px; text-align: center; }
        p { color: #64748B; font-size: 0.9rem; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; color: #334155; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #0066B3; }
        .btn-login {
            width: 100%;
            background: #0066B3;
            color: white;
            font-weight: 800;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #004d87; }
        .error-banner {
            background: #FEE2E2;
            color: #991B1B;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Top Left Red Back Button -->
        <a href="/" class="btn-back-red">
            <span style="font-size: 1.1rem; line-height: 1;">&#8592;</span> Back
        </a>

        <h2>Admin Console</h2>
        <p>Kidzee Jammu Portal Management</p>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" name="username" required autofocus placeholder="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
    </div>
</body>
</html>
